<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Wood Spawning Controller - MDCU 2026</title>
  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Prompt:ital,wght@0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,300;1,400;1,500;1,600;1,700;1,800;1,900&family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="./style.css">
</head>
<body>
  <div class="back-link-container">
    <a href="../index.html" class="back-link">&larr; Back to Portal</a>
  </div>

  <main class="container" id="timer-app">
    <header>
      <h1>Wood Spawning</h1>
      <p class="subtitle">Big Screen Display & Keyboard Controller</p>
    </header>

    <!-- Circular Timer Progress -->
    <div class="timer-container" id="timer-visual-container">
      <svg class="timer-svg" viewBox="0 0 320 320">
        <!-- Background ring -->
        <circle class="timer-circle-bg" cx="160" cy="160" r="140"></circle>
        <!-- Dynamic overlay ring (circumference = 2 * PI * 140 = 879.64px) -->
        <circle class="timer-circle-progress" id="timer-progress" cx="160" cy="160" r="140" stroke-dasharray="880" stroke-dashoffset="0"></circle>
      </svg>
      <div class="timer-text-container">
        <span class="time-display" id="time-display">--</span>
        <span class="time-label" id="time-label">Ready</span>
      </div>
    </div>

    <!-- Cycle badge (shows the active loop index) -->
    <div id="cycle-badge-container">
      <span class="cycle-badge" id="cycle-badge" style="display: none;">Cycle #1</span>
      <span class="state-paused-badge" id="paused-badge" style="display: none;">PAUSED</span>
    </div>

    <!-- Info & Shortcut panel -->
    <section class="panel">
      <div class="status-badge status-disconnected" id="conn-status">
        <span class="status-dot"></span>
        <span id="conn-status-text">Disconnected</span>
      </div>

      <div class="hotkeys-list">
        <div class="hotkey-item">
          <span class="hotkey-label">Start/Restart 60s Loop</span>
          <kbd class="hotkey-key">1</kbd>
        </div>
        <div class="hotkey-item">
          <span class="hotkey-label">Pause / Resume Timer</span>
          <kbd class="hotkey-key">Space</kbd>
        </div>
        <div class="hotkey-item">
          <span class="hotkey-label">Disaster Mode (Toggle)</span>
          <kbd class="hotkey-key">D</kbd>
        </div>
        <div class="hotkey-item">
          <span class="hotkey-label">Reset / Clear State</span>
          <kbd class="hotkey-key">Esc</kbd>
        </div>
      </div>
    </section>
  </main>

  <script type="module" src="./main.js"></script>
</body>
</html>
