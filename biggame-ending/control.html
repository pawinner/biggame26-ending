<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Overlay Controller - MDCU 2026</title>
  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Prompt:ital,wght@0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,300;1,400;1,500;1,600;1,700;1,800;1,900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="./css/control.css">
</head>
<body>
  <div class="back-link-container">
    <a href="../index.html" class="back-link">&larr; Back to Portal</a>
  </div>

  <div class="control-container">
    <header class="control-header">
      <h1>Big Game Controller</h1>
      <p>Control the OBS Overlay in real-time</p>
      <div id="status-bar" class="status-disconnected">Connecting to Firebase...</div>
    </header>

    <main class="control-grid">
      <!-- Ranks Cues -->
      <section class="control-card">
        <h2>Announcements</h2>
        <div class="button-group">
          <button class="cue-btn" data-action="rank-12-4">Announce 12th - 4th</button>
          <button class="cue-btn" data-action="rank-3">Announce 3rd Place</button>
          <button class="cue-btn" data-action="rank-2">Announce 2nd Place</button>
          <button class="cue-btn" data-action="winner">Announce Winner</button>
          <button class="cue-btn" data-action="podium">Announce Podium (End Game)</button>
        </div>
      </section>

      <!-- Leaderboard Reveal Controls -->
      <section class="control-card reveal-controls" id="reveal-controls-section" style="display: none;">
        <h2>Leaderboard Reveal Controls</h2>
        <div style="margin-bottom: 1rem; font-size: 0.95rem; color: var(--text-secondary);" id="reveal-status">
          Current Reveal: None
        </div>
        <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 1rem; margin-bottom: 1rem;">
          <button class="cue-btn reveal-btn" id="reveal-next-btn">Reveal Next</button>
          <button class="cue-btn reveal-btn" id="reveal-prev-btn">Hide Last</button>
        </div>
        <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 1rem;">
          <button class="cue-btn reveal-btn" id="reveal-all-btn">Reveal All</button>
          <button class="cue-btn reveal-btn" id="reveal-none-btn">Hide All</button>
        </div>
      </section>

      <!-- System controls -->
      <section class="control-card system-controls">
        <h2>System Controls</h2>
        <div class="button-group">
          <button class="cue-btn reset-btn" data-action="reset">Reset Overlay</button>
          <button class="cue-btn hide-btn" data-action="hide">Hide All Overlay</button>
        </div>
      </section>
    </main>
  </div>

  <script type="module" src="./js/control.js"></script>
</body>
</html>
